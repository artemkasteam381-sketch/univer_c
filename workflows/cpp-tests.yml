name: C++ CI with Google Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ cmake make
        
    - name: Build with CMake
      run: |
        mkdir build
        cd build
        cmake ..
        make -j4
        
    - name: Run tests
      run: |
        cd build
        ./SparseVectorTest
        
    - name: Run example program
      run: |
        cd build
        ./ExampleProgram
        
    - name: Build with Makefile
      run: |
        make clean
        make test
        
    - name: Archive test results
      if: always()  
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: |
          build/SparseVectorTest
          build/ExampleProgram
