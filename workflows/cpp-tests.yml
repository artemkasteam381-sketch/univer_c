name: C++ Tests

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check files
      run: |
        echo "=== ПРОВЕРКА ФАЙЛОВ ==="
        ls -la
        echo ""
        echo "Важные файлы:"
        ls -la SparseVector.h SparseVector.cpp TestSparseVector.cpp example.cpp CMakeLists.txt Makefile 2>/dev/null || echo "Некоторые файлы отсутствуют"
        
    - name: Install
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make cmake libgtest-dev
        
    - name: Setup Google Test
      run: |
        cd /usr/src/gtest
        sudo cmake CMakeLists.txt
        sudo make
        sudo cp lib/*.a /usr/lib
        
    - name: Run direct tests
      run: |
        echo "=== ПРЯМОЙ ЗАПУСК ТЕСТОВ ==="
        g++ -std=c++17 -c SparseVector.cpp && echo "✅ SparseVector.cpp compiled"
        g++ -std=c++17 SparseVector.cpp TestSparseVector.cpp -o test_runner -lgtest -lgtest_main -lpthread
        ./test_runner
        
    - name: Run example
      run: |
        echo "=== ЗАПУСК ПРИМЕРА ==="
        g++ -std=c++17 SparseVector.cpp example.cpp -o example_runner
        ./example_runner
        
    - name: Try CMake
      if: always()
      run: |
        if [ -f "CMakeLists.txt" ]; then
          echo "=== ТЕСТ CMake ==="
          mkdir -p build && cd build
          cmake .. && make
        fi
        
    - name: Try Makefile
      if: always()
      run: |
        if [ -f "Makefile" ]; then
          echo "=== ТЕСТ Makefile ==="
          make clean || true
          make test || make || echo "Make завершился"
        fi
