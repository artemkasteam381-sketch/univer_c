name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install compiler
      run: sudo apt-get update && sudo apt-get install -y g++
      
    - name: Build with Makefile
      run: make
      
    - name: Run program
      run: make test
      
    - name: Clean build
      run: make clean
