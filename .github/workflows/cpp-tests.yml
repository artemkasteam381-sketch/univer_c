name: C++ CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ cmake make libgtest-dev
        
    - name: Setup GoogleTest
      run: |
        cd /usr/src/gtest
        sudo cmake CMakeLists.txt
        sudo make
        sudo cp lib/*.a /usr/lib
        
    - name: Compile and run tests
      run: |
        g++ -std=c++17 TestHeap.cpp -o heap_test -lgtest -lgtest_main -lpthread
        ./heap_test
        
    - name: Run example
      run: |
        g++ -std=c++17 example.cpp -o heap_example
        ./heap_example
