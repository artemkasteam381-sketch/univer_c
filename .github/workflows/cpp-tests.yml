name: C++ Tests

on:
  push:
    branches: [ heap ]
  pull_request:
    branches: [ heap ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ make
    
    - name: Compile
      run: g++ -std=c++11 -o test_heap TextHeap.cpp Heap.tpp
    
    - name: Run tests
      run: ./test_heap
